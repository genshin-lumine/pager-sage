[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-sage"
version = "0.1.0"
description = "A project-scoped paper workspace with retrieval, agent workflows, and traceable evidence"
readme = "readme.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["paper_sage*"]
namespaces = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
